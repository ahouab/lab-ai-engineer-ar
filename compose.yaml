name: lab-ai-ar

services:
  ollama:
    image: ollama/ollama:0.40.18
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_MAX_QUEUE: "8"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks: [chat, rag]

  webui:
    image: ghcr.io/open-webui/open-webui:v0.13.5
    restart: unless-stopped
    depends_on: [ollama]
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      ENABLE_OPENAI_API: "False"
      WEBUI_AUTH: "True"
      DEFAULT_LOCALE: "ar"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?أنشئ الملف .env قبل تشغيل Compose}"
      OFFLINE_MODE: "True"
      RAG_EMBEDDING_ENGINE: "ollama"
      RAG_EMBEDDING_MODEL: "bge-m3:latest"
      RAG_OLLAMA_BASE_URL: "http://ollama:11434"
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - webui_data:/app/backend/data
    networks: [chat]

  qdrant:
    image: qdrant/qdrant:v1.20.2
    profiles: [rag]
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [rag]

  rag:
    build: .
    profiles: [rag]
    restart: unless-stopped
    depends_on: [ollama, qdrant]
    environment:
      OLLAMA_URL: "http://ollama:11434"
      QDRANT_URL: "http://qdrant:6333"
      CHAT_MODEL: "${CHAT_MODEL:-qwen3:4b}"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./corpus:/corpus:ro
    networks: [rag]

networks:
  chat:
  rag:

volumes:
  ollama_data:
  webui_data:
  qdrant_data:
